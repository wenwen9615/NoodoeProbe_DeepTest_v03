name: NoodoeProbeDeep
options:
  bundleIdPrefix: io.github.noodoeprobe
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  NoodoeProbeDeep:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Noodoe DeepProbe
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: 用於掃描儀表的 BLE 服務與診斷連線；不會自動寫入特徵值。
        UISupportedExternalAccessoryProtocols:
          - sunray.control
          - sunray.data
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.noodoeprobe.deep.v03
        TARGETED_DEVICE_FAMILY: "1"
