name: Build unsigned DeepProbe IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS app without signing
        run: |
          xcodebuild -project NoodoeProbeDeep.xcodeproj -scheme NoodoeProbeDeep -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NoodoeProbeDeep.app Payload/
          zip -qr NoodoeProbe_DeepTest_v03_unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NoodoeProbe-DeepTest-v03-unsigned
          path: NoodoeProbe_DeepTest_v03_unsigned.ipa
